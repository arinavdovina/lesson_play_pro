<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dj rt</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet" />
<style>
body { margin:0; overflow:hidden; font-family:"Roboto Condensed",sans-serif; }
#gameContainer { position:relative; width:100vw; height:100vh; background:url("../../assets/13-0.webp") repeat-y center top; background-size:cover; }
#task { position:absolute; top:20px; width:100%; text-align:center; font-size:28px; color:white; text-shadow:0 0 5px black; z-index:20; }
#counters { position:absolute; top:20px; right:50px; display:flex; gap:20px; background:rgba(0,0,0,0.4); backdrop-filter:blur(8px); border-radius:20px; padding:15px 25px; z-index:20; }
.counter { font-size:28px; font-weight:bold; }
.correct { color:#00ff88; }
.mistake { color:#c080ff; }
#finalImage { position:absolute; width:150px; z-index:5; transition:filter 0.4s ease; }
.pulseGold { animation:pulseGlow 1.2s ease-in-out infinite; filter:drop-shadow(0 0 18px rgba(255,215,0,0.9)); }
@keyframes pulseGlow { 0%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(255,215,0,0.6));}50%{transform:scale(1.06);filter:drop-shadow(0 0 22px rgba(255,215,0,1));}100%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(255,215,0,0.6));} }
.platform { position:absolute; width:160px; text-align:center; font-size:24px; font-weight:600; color:white; text-shadow:0 0 4px black; cursor:pointer; transition:transform 0.15s ease; }
.platform:hover { transform:scale(1.04); }
.wordLabel { font-size:22px; position:absolute; text-align:center; color:white; text-shadow:0 0 3px black; font-weight:700; width:160px; pointer-events:none; }
#character { position:absolute; width:110px; height:auto; z-index:10; will-change:transform,left,bottom; transition:left 0.45s cubic-bezier(.22,.98,.34,1), bottom 0.45s cubic-bezier(.22,.98,.34,1); transform-origin:center; }
.flashGold, .flashMistake { position:absolute; border-radius:50%; opacity:0; }
.flashGold { width:100px; height:100px; background:radial-gradient(circle,gold,transparent); animation:flashGoldAnim 0.6s forwards; }
.flashMistake { width:140px; height:140px; background:radial-gradient(circle, rgba(0,0,0,0.65), transparent); animation:flashMistakeAnim 2.2s forwards; }
@keyframes flashGoldAnim {0%{opacity:1; transform:scale(0.5);}100%{opacity:0; transform:scale(2);}}
@keyframes flashMistakeAnim {0%{opacity:0.7; transform:scale(0.4);}100%{opacity:0; transform:scale(2.8);}}
#overlay { position:absolute; width:100%; height:100%; top:0; left:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(5px); display:flex; justify-content:center; align-items:center; flex-direction:column; color:white; font-size:48px; display:none; z-index:200; }
#overlay span { margin-top:20px; font-size:26px; color:#ffd700; cursor:pointer; }
canvas#confetti { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:150; }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="task">Выбери все предложения, где действие происходит сейчас.</div>
  <div id="counters">
    <div class="counter correct" id="correctCount">0</div>
    <div class="counter mistake" id="mistakeCount">0</div>
  </div>
  <img id="finalImage" src="../../assets/13-3.webp" />
  <img id="character" src="../../assets/13-2.webp" />
  <canvas id="confetti"></canvas>
  <div id="overlay"><div id="overlayText"></div><span id="restartBtn">Try again?</span></div>
</div>
<script>
const correctWords=["She is painting a rainbow.","We are watching a funny movie.","The dog is running in the park.","She is talking on the phone.","He is jumping on the trampoline."];
const wrongWords=["I eat breakfast.","They play football every Sunday.","He sleeps at night.","I brush my teeth every morning.","I go to school by bus."];
let uniqueWords=[...correctWords];
while(uniqueWords.length<10){const r=wrongWords[Math.floor(Math.random()*wrongWords.length)]; if(!uniqueWords.includes(r)) uniqueWords.push(r);}
let allWords=uniqueWords.sort(()=>Math.random()-0.5);

const platformImages=["../../assets/13-1.webp"];
const container=document.getElementById("gameContainer");
const character=document.getElementById("character");
const correctCountEl=document.getElementById("correctCount");
const mistakeCountEl=document.getElementById("mistakeCount");
const overlay=document.getElementById("overlay");
const overlayText=document.getElementById("overlayText");
const restartBtn=document.getElementById("restartBtn");
const finalImage=document.getElementById("finalImage");
const confettiCanvas=document.getElementById("confetti");
const ctx=confettiCanvas.getContext("2d");

let correct=0, mistakes=0, platforms=[], canClick=true, lastColumn=null, isJumping=false, lastCorrectPlatform=null;

function resizeConfetti(){ confettiCanvas.width=window.innerWidth; confettiCanvas.height=window.innerHeight; updatePositions(); }
window.addEventListener("resize", resizeConfetti);

let columns=[], columnCounts=[3,2,2,3], bottomMargin=170, stepY=150;

function createPlatforms(){
  const screenW = window.innerWidth;
  columns=[];
  const totalColumns = 4;
  const columnWidth = (screenW / (totalColumns + 1)) * 0.9;
  const shiftLeft = screenW*0.15;
  for(let i=1;i<=totalColumns;i++) columns.push(i*columnWidth - shiftLeft);

  platforms.forEach(p=>{p.el.remove(); if(p.label) p.label.remove();});
  platforms=[];

  let index=0;
  for(let c=0;c<totalColumns;c++){
    for(let i=0;i<columnCounts[c];i++){
      if(index>=allWords.length) break;
      const word = allWords[index];
      const img=document.createElement("img");
      img.src=platformImages[0]; img.classList.add("platform");
      img.dataset.word=word; img.dataset.clicked="false"; img.dataset.column=c; img.dataset.row=i;
      container.appendChild(img);
      const label=document.createElement("div"); label.classList.add("wordLabel"); label.textContent=word;
      container.appendChild(label);
      platforms.push({el:img,label:label,column:c,row:i});
      index++;
    }
  }

  updatePositions();
  platforms.forEach(p=>p.el.addEventListener("click",handleClick));
}

function updatePositions(){
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;
  const columnWidth = (screenW / 5) * 0.9;
  const shiftLeft = screenW*0.15;
  columns=[1*columnWidth - shiftLeft,2*columnWidth - shiftLeft,3*columnWidth - shiftLeft,4*columnWidth - shiftLeft];

  platforms.forEach(p=>{
    const left = columns[p.column];
    const bottom = bottomMargin + p.row*stepY;
    p.el.style.left = left+"px";
    p.el.style.bottom = bottom+"px";
    if(p.label) p.label.style.left=left+"px";
    if(p.label) p.label.style.bottom=(bottom+50)+"px";
  });

  if(lastCorrectPlatform){
    const rect = lastCorrectPlatform.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();
    const targetX = rect.left - containerRect.left + rect.width/2 - (character.offsetWidth||110)/2;
    const targetBottom = containerRect.height - (rect.top - containerRect.top) - lastCorrectPlatform.offsetHeight;
    character.style.left = targetX+"px"; character.style.bottom = targetBottom+"px";
  } else if(finalImage){
    const left = parseFloat(finalImage.style.left)||screenW/2;
    character.style.left = left + finalImage.offsetWidth/2 - character.offsetWidth/2+"px";
    character.style.bottom = "40px";
  }

  if(finalImage){
    const mid = (columns[1]+columns[2])/2;
    finalImage.style.left = mid+"px";
    finalImage.style.bottom = (bottomMargin + 2*stepY + 50)+"px";
  }
}

createPlatforms();

function flashGold(x,y){const f=document.createElement("div"); f.className="flashGold"; f.style.left=x+"px"; f.style.top=y+"px"; container.appendChild(f); setTimeout(()=>f.remove(),700);}
function flashMistake(x,y){const f=document.createElement("div"); f.className="flashMistake"; f.style.left=x+"px"; f.style.top=y+"px"; container.appendChild(f); setTimeout(()=>f.remove(),2400);}
function getCharPos(){const s=window.getComputedStyle(character); return {left:parseFloat(s.left)||0,bottom:parseFloat(s.bottom)||40};}

function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function animateJump(startX, startBottom, endX, endBottom, duration=500){
  if(isJumping) return Promise.resolve();
  isJumping=true;
  return new Promise(resolve=>{
    const startTime=performance.now();
    const verticalDist=Math.abs(endBottom-startBottom);
    const arcHeight=Math.max(80,verticalDist*0.6+80);
    function frame(now){
      const tRaw=(now-startTime)/duration;
      const t=Math.min(1,Math.max(0,tRaw));
      const hx=easeInOutCubic(t);
      const curX=startX+(endX-startX)*hx;
      const linearY=startBottom+(endBottom-startBottom)*t;
      const parabola=arcHeight*4*t*(1-t);
      character.style.left=Math.round(curX)+"px";
      character.style.bottom=Math.round(linearY+parabola)+"px";
      if(t<1) requestAnimationFrame(frame);
      else { setTimeout(()=>{isJumping=false; resolve();},20);}
    }
    requestAnimationFrame(frame);
  });
}

async function jumpTo(platformEl,correctChoice){
  if(isJumping) return;
  const rect=platformEl.getBoundingClientRect();
  const containerRect=container.getBoundingClientRect();
  const targetX=Math.round(rect.left-containerRect.left+rect.width/2-(character.offsetWidth||110)/2);
  const targetBottom=Math.round(containerRect.height-(rect.top-containerRect.top)-platformEl.offsetHeight);
  const column=parseInt(platformEl.dataset.column);
  if(lastColumn===null) lastColumn=column;
  if(column!==lastColumn) character.style.transform=column>lastColumn?"scaleX(-1)":"scaleX(1)";
  lastColumn=column;
  const cur=getCharPos();
  await animateJump(cur.left,cur.bottom,targetX,targetBottom,550);
  if(correctChoice){ flashGold(targetX,containerRect.height-targetBottom-100); lastCorrectPlatform=platformEl; }
  else { flashMistake(targetX,containerRect.height-targetBottom-80); await fallBack(); }
}

function fallBack(){
  if(!lastCorrectPlatform) return;
  const rect=lastCorrectPlatform.getBoundingClientRect();
  const containerRect=container.getBoundingClientRect();
  const targetX=Math.round(rect.left-containerRect.left+rect.width/2-(character.offsetWidth||110)/2);
  const targetBottom=Math.round(containerRect.height-(rect.top-containerRect.top)-lastCorrectPlatform.offsetHeight);
  const cur=getCharPos();
  return animateJump(cur.left,cur.bottom,targetX,targetBottom,600);
}

function handleClick(e){
  if(!canClick) return;
  const platformEl=e.currentTarget;
  if(platformEl.dataset.clicked==="true") return;
  platformEl.dataset.clicked="true";
  const word=platformEl.dataset.word;
  const isCorrect=correctWords.includes(word);
  if(isCorrect){
    correct++; correctCountEl.textContent=correct;
    jumpTo(platformEl,true).then(()=>{
      if(correct===correctWords.length){
        finalImage.classList.add("pulseGold");
        finalImage.onclick=()=>{ fireConfetti(); overlay.style.display="flex"; overlayText.textContent="Good job!"; restartBtn.textContent="Try again?"; };
      }
    });
  } else {
    mistakes++; mistakeCountEl.textContent=mistakes;
    jumpTo(platformEl,false);
    if(mistakes>=3) setTimeout(gameOver,600);
  }
}

function gameOver(){ overlay.style.display="flex"; overlayText.textContent="Game over"; restartBtn.textContent="Try again?"; }
platforms.forEach(p=>p.el.addEventListener("click",handleClick));
restartBtn.addEventListener("click",()=>location.reload());

let confettis=[];
function fireConfetti(){ for(let i=0;i<200;i++){ confettis.push({x:Math.random()*confettiCanvas.width,y:Math.random()*confettiCanvas.height*0.2,r:Math.random()*6+2,dx:(Math.random()-0.5)*2,dy:2+Math.random()*4,angle:Math.random()*Math.PI*2,color:`hsl(${Math.random()*360},100%,50%)`}); } }
function drawConfetti(){ ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); for(let i=confettis.length-1;i>=0;i--){ const c=confettis[i]; c.x+=c.dx;c.y+=c.dy;c.angle+=0.1; ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle); ctx.fillStyle=c.color; ctx.fillRect(-c.r/2,-c.r/2,c.r,c.r); ctx.restore(); if(c.y>confettiCanvas.height+50) confettis.splice(i,1); } requestAnimationFrame(drawConfetti); }
drawConfetti();
</script>
</body>
</html>
