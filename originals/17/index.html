<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mouse Runner: Grammar Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto:wght@500&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            font-family: 'Roboto', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* Фон за пределами дороги */
            background: url('../../assets/17-0.webp') no-repeat center bottom;
            background-size: cover;
        }

        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 50%);
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI: Общие стили для модальных окон --- */
        .modal-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .modal-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 5px solid #2196F3;
            font-family: 'Roboto', sans-serif;
        }
        
        .modal-card h2 {
            font-family: 'Fredoka One', cursive;
            color: #2196F3;
            font-size: 36px;
            margin-top: 0;
        }
        
        .modal-card p {
            font-size: 18px;
            margin-bottom: 25px; 
        }


        /* --- UI: Кнопка Старт/Рестарт --- */
        .btn-action {
            padding: 15px 50px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Fredoka One', cursive;
            box-shadow: 0 6px 0 #2E7D32;
            margin-top: 20px;
            transition: transform 0.1s;
        }
        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2E7D32;
        }

        /* --- UI: Верхняя панель и Прогресс Бар --- */
        #ui-top-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none; 
            z-index: 10;
        }

        #ui-hearts {
            font-size: 40px;
            color: #ff4444;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 5px;
        }

        #ui-score {
            color: #FFD700;
            font-size: 36px;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0 #000;
        }
        
        /* Прогресс Бар */
        #progress-bar-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 25px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid white;
            z-index: 10;
        }

        #progress-bar {
            height: 100%;
            width: 0%; 
            background: linear-gradient(to right, #2196F3, #03A9F4);
            box-shadow: 0 0 10px #03A9F4, 0 0 20px rgba(3, 169, 244, 0.5);
            transition: width 0.5s ease-out;
            transform-origin: left; 
        }
        
        /* Уведомление об ускорении: СКРЫВАЕМ */
        #speed-up-msg {
            display: none; 
        }


        /* --- UI: Модальное окно с вопросом --- */
        #question-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 40;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #question-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 5px solid #2196F3;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #q-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .answer-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Fredoka One', cursive;
            color: #555;
        }

        .answer-btn:hover {
            background-color: #e3f2fd;
            border-color: #2196F3;
            transform: translateY(-2px);
        }

        /* --- UI: Game Over / Game Complete --- */
        #ui-game-over {
            display: none;
            color: white;
        }

        #ui-game-over h1 {
            font-size: 60px;
            font-family: 'Fredoka One', cursive;
            margin: 0;
            text-shadow: 4px 4px 0 #000;
        }
        
        #game-over-title.fail {
             color: #ff4444;
        }
        #game-over-title.complete {
             color: #4CAF50;
        }

        /* Прочее */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0 #000;
        }

        #controls-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="game-overlay"></div>
    <div id="speed-up-msg" style="display: none;">SPEED UP! 🚀</div>
    
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <div id="ui-top-bar">
        <div id="ui-hearts">❤️❤️❤️</div>
        <div id="ui-score">★ 0</div>
    </div>

    <div id="start-modal" class="modal-screen">
        <div class="modal-card">
            <h2>Hello!</h2>
            
            <p>I need your help to run and answer 15 English questions!</p>
            <p style="font-size: 16px; font-style: italic; color: #ff4444;"> Be careful! Colliding with 3 obstacles in a row will cost a life!</p>

            <button class="btn-action" onclick="hideStartModalAndStart()">Start Adventure!</button>
        </div>
    </div>

    <div id="question-modal" class="modal-screen" style="display: none;">
        <div id="question-card">
            <div id="q-text">Question?</div>
            <div id="answers-container">
                </div>
        </div>
    </div>

    <div id="ui-game-over" class="modal-screen" style="display: none;">
        <h1 id="game-over-title">GAME OVER</h1>
        <p id="final-score" style="font-size: 28px; margin-bottom: 30px;">Total Score: 0</p>
        <button class="btn-action" onclick="startGame()">Play Again</button>
    </div>

    <div id="loading">Loading Game...</div>
    <div id="controls-hint">⬅️ ➡️ - Run | ⬆️ or SPACE - Jump</div>
</div>

<script>
    // --- НАСТРОЙКИ И РЕСУРСЫ ---
    const ASSETS = {
        player: '../../assets/17-4.webp',
        obstacles: [
            '../../assets/17-2.webp',
            '../../assets/17-3.webp',
            '../../assets/17-1.webp'
        ]
    };

    // --- ПУЛ ВОПРОСОВ ---
    const QUESTIONS_POOL = [
        { q: "_____ you like bananas?", options: ["Do", "Does"], correctIndex: 0 },
        { q: "_____ she like pizza?", options: ["Do", "Does"], correctIndex: 1 },
        { q: "_____ they play football?", options: ["Do", "Does"], correctIndex: 0 },
        { q: "_____ he like dogs?", options: ["Do", "Does"], correctIndex: 1 },
        { q: "_____ I have a pet?", options: ["Do", "Does"], correctIndex: 0 }, 
        { q: "_____ she like milk?", options: ["Do", "Does"], correctIndex: 1 }, 
        { q: "_____ we go to school every day?", options: ["Do", "Does"], correctIndex: 0 },
        { q: "_____ they watch TV in the morning?", options: ["Do", "Does"], correctIndex: 0 }, 
        { q: "_____ it rain a lot in spring?", options: ["Do", "Does"], correctIndex: 1 },
        { q: "_____ he play tennis?", options: ["Do", "Does"], correctIndex: 1 }, 
        { q: "_____ you like fish?", options: ["Do", "Does"], correctIndex: 0 }, 
        { q: "_____ my brother speak English?", options: ["Do", "Does"], correctIndex: 1 }, 
        { q: "_____ we eat breakfast at 10 o’clock?", options: ["Do", "Does"], correctIndex: 0 }, 
        { q: "_____ she have a bicycle?", options: ["Do", "Does"], correctIndex: 1 },
        { q: "_____ I know the answer?", options: ["Do", "Does"], correctIndex: 0 } 
    ];

    const TOTAL_QUESTIONS = QUESTIONS_POOL.length;
    let availableQuestions = []; 

    const CANVAS = document.getElementById('gameCanvas');
    const CTX = CANVAS.getContext('2d');
    const speedUpMsg = document.getElementById('speed-up-msg'); 

    // Состояние игры
    let gameState = {
        isPlaying: false,
        isPaused: true, 
        score: 0,
        lives: 3,
        speed: 8, // <-- ФИКСИРОВАННАЯ СКОРОСТЬ
        
        laneWidth: 140, 
        lanes: [-1, 0, 1], 
        playerLane: 1, 
        
        // ФИЗИКА ПРЫЖКА (ИЗМЕНЕНО ДЛЯ МЕДЛЕННОГО И ВЫСОКОГО ПРЫЖКА)
        playerY: 0,
        playerVy: 0,
        gravity: 0.15, // <-- ИЗМЕНЕНО: Снизили гравитацию для более долгого полета
        jumpForce: 30, // <-- ИЗМЕНЕНО: Увеличили силу прыжка для большей высоты
        isJumping: false,

        isInvincible: false,
        invincibleTimer: 0,
        
        // НОВЫЙ ПАРАМЕТР: СЧЕТЧИК ПОСЛЕДОВАТЕЛЬНЫХ УДАРОВ
        consecutiveHits: 0, 

        objects: [], 
        questionTimer: 0,
        images: {}
    };

    let perspective = {
        fieldOfView: 600,
        cameraHeight: 250,
        horizonY: 0 
    };

    // --- ЗАГРУЗКА И НАЧАЛЬНЫЙ ЗАПУСК ---
    let imagesLoaded = 0;
    const totalImages = 1 + ASSETS.obstacles.length; 

    function checkLoad() {
        imagesLoaded++;
        if (imagesLoaded === totalImages) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('start-modal').style.display = 'flex';
        }
    }

    gameState.images.player = new Image();
    gameState.images.player.src = ASSETS.player;
    gameState.images.player.onload = checkLoad;
    
    gameState.images.obstacles = [];
    ASSETS.obstacles.forEach(src => {
        let img = new Image();
        img.src = src;
        img.onload = checkLoad;
        gameState.images.obstacles.push(img);
    });

    // --- ИГРОВОЙ ПРОЦЕСС ---

    function resize() {
        CANVAS.width = window.innerWidth;
        CANVAS.height = window.innerHeight;
        perspective.horizonY = CANVAS.height * 0.45; 
    }
    window.addEventListener('resize', resize);
    resize();

    function updateProgressBar() {
        const remaining = availableQuestions.length;
        const progressPercent = ((TOTAL_QUESTIONS - remaining) / TOTAL_QUESTIONS) * 100;
        document.getElementById('progress-bar').style.width = progressPercent + '%';
        
        if (remaining === 0) {
            gameComplete();
        }
    }
    
    function hideStartModalAndStart() {
        document.getElementById('start-modal').style.display = 'none';
        startGame();
    }

    function startGame() {
        gameState.isPlaying = true;
        gameState.isPaused = false;
        gameState.score = 0;
        gameState.lives = 3;
        gameState.speed = 8; // Сброс до фиксированной скорости
        
        gameState.consecutiveHits = 0; // СБРОС СЧЕТЧИКА УДАРОВ
        
        gameState.objects = [];
        
        availableQuestions = [...QUESTIONS_POOL];
        availableQuestions.sort(() => Math.random() - 0.5); 
        
        gameState.playerLane = 1;
        gameState.playerY = 0;
        gameState.isJumping = false;
        gameState.isInvincible = false;
        
        gameState.questionTimer = Date.now() + 5000; 

        updateUI();
        updateProgressBar();
        document.getElementById('ui-game-over').style.display = 'none';
        document.getElementById('question-modal').style.display = 'none';
        
        lastTime = Date.now();
        requestAnimationFrame(gameLoop);
    }

    function updateUI() {
        let heartsStr = "";
        for(let i=0; i<gameState.lives; i++) heartsStr += "❤️";
        document.getElementById('ui-hearts').innerText = heartsStr;
        document.getElementById('ui-score').innerText = "★ " + gameState.score;
    }

    // takeDamage теперь вызывается только при штрафе (3 удара или неправильный ответ)
    function takeDamage() {
        gameState.lives--;
        updateUI();
        
        // Включаем длительную неуязвимость, чтобы игрок мог восстановиться после штрафа.
        gameState.isInvincible = true;
        gameState.invincibleTimer = Date.now();

        if (gameState.lives <= 0) {
            gameOver("GAME OVER", "fail");
        }
    }

    function gameOver(title, status) {
        gameState.isPlaying = false;
        const goScreen = document.getElementById('ui-game-over');
        const titleElement = document.getElementById('game-over-title');
        
        titleElement.innerText = title;
        titleElement.className = status; 
        
        document.getElementById('final-score').innerText = "Total Score: " + gameState.score;
        goScreen.style.display = 'flex';
    }
    
    function gameComplete() {
        gameOver("LEVEL COMPLETE!", "complete");
    }


    // --- СИСТЕМА ВОПРОСОВ ---
    function showQuestion() {
        if (availableQuestions.length === 0) {
            gameState.questionTimer = Date.now() + 10000; 
            return;
        }
        
        gameState.isPaused = true; 
        
        const qData = availableQuestions[0]; 
        const modal = document.getElementById('question-modal');
        const qText = document.getElementById('q-text');
        const ansContainer = document.getElementById('answers-container');

        qText.innerText = qData.q;
        ansContainer.innerHTML = ''; 

        qData.options.forEach((opt, index) => {
            let btn = document.createElement('button');
            btn.className = 'answer-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(index === qData.correctIndex);
            ansContainer.appendChild(btn);
        });

        modal.style.display = 'flex';
    }

    function handleAnswer(isCorrect) {
        document.getElementById('question-modal').style.display = 'none';
        
        availableQuestions.shift(); 
        updateProgressBar();
        
        if (isCorrect) {
             gameState.score += 100; 
             updateUI();
             gameState.consecutiveHits = 0; // СБРОС: Правильный ответ сбрасывает счетчик ударов
        } else {
            // Неправильный ответ сразу отнимает жизнь
            takeDamage(); 
        }

        if (gameState.lives > 0 && availableQuestions.length > 0) {
            gameState.isPaused = false;
            // Частота вопросов 5-10 секунд
            gameState.questionTimer = Date.now() + 5000 + Math.random() * 5000; 
            lastTime = Date.now(); 
            requestAnimationFrame(gameLoop);
        } else if (availableQuestions.length === 0) {
            gameComplete();
        }
    }

    // --- ОБЪЕКТЫ ---
    class GameObject {
        constructor(z) {
            this.z = z;
            this.active = true;
        }
        update(dt) {
            if (!gameState.isPaused) {
                // Скорость движения объектов зависит от фиксированной gameState.speed
                this.z -= gameState.speed * (dt / 16); 
            }
        }
    }

    class GameItem extends GameObject {
        constructor(z, laneIndex) {
            super(z, laneIndex);
            this.laneIndex = laneIndex; 
        }
        draw() {
            if (this.z < -perspective.fieldOfView + 50) return;
            const scale = perspective.fieldOfView / (perspective.fieldOfView + this.z);
            const x = (CANVAS.width / 2) + (gameState.lanes[this.laneIndex] * gameState.laneWidth * 3 * scale);
            const y = perspective.horizonY + (perspective.cameraHeight * scale);
            this.render(x, y, scale);
        }
        render(x, y, scale) {}
    }

    class Obstacle extends GameItem {
        constructor(z, laneIndex) {
            super(z, laneIndex);
            this.image = gameState.images.obstacles[Math.floor(Math.random() * gameState.images.obstacles.length)];
            this.type = 'obstacle';
        }
        render(x, y, scale) {
            // Размер препятствия 20%
            const w = this.image.width * 0.20 * scale;
            const h = this.image.height * 0.20 * scale;
            CTX.drawImage(this.image, x - w/2, y - h + 15*scale, w, h);
        }
    }

    class Star extends GameItem {
        constructor(z, laneIndex) {
            super(z, laneIndex);
            this.type = 'star';
        }
        render(x, y, scale) {
            const size = 60 * scale; 
            const bounce = Math.sin(Date.now() / 200) * 20 * scale;

            CTX.save();
            CTX.translate(x, y - size - bounce);
            
            CTX.beginPath();
            CTX.fillStyle = "#FFD700";
            CTX.shadowColor = "#FFA000";
            CTX.shadowBlur = 10;
            
            for (let i = 0; i < 5; i++) {
                CTX.lineTo(Math.cos((18 + i * 72) * 0.01745) * size/2, -Math.sin((18 + i * 72) * 0.01745) * size/2);
                CTX.lineTo(Math.cos((54 + i * 72) * 0.01745) * size/4, -Math.sin((54 + i * 72) * 0.01745) * size/4);
            }
            CTX.closePath();
            CTX.fill();
            CTX.restore();
        }
    }

    // --- УПРАВЛЕНИЕ ---
    let targetLane = 1;
    let currentLaneX = 1;

    function switchLane(dir) {
        if (!gameState.isPlaying || gameState.isPaused) return;
        targetLane += dir;
        if (targetLane < 0) targetLane = 0;
        if (targetLane > 2) targetLane = 2;
    }

    function jump() {
        if (!gameState.isPlaying || gameState.isPaused) return;

        if (!gameState.isJumping) {
            gameState.playerVy = gameState.jumpForce; // Использование новой, большей силы прыжка
            gameState.isJumping = true;
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') switchLane(-1);
        if (e.key === 'ArrowRight' || e.key === 'd') switchLane(1);
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
    });

    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    });
    document.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dy) > Math.abs(dx) && dy < -40) jump();
        else if (Math.abs(dx) > 30) { dx < 0 ? switchLane(-1) : switchLane(1); }
    });

    // --- MAIN LOOP ---
    let lastTime = 0;
    
    function gameLoop() {
        if (!gameState.isPlaying) return;
        if (gameState.isPaused) {
            requestAnimationFrame(gameLoop);
            return;
        }

        const now = Date.now();
        const dt = now - lastTime;
        lastTime = now;

        // ФИЗИКА ПРЫЖКА (Использует новую низкую гравитацию)
        if (gameState.isJumping) {
            gameState.playerY += gameState.playerVy;
            gameState.playerVy -= gameState.gravity; 
            
            if (gameState.playerY <= 0) {
                gameState.playerY = 0;
                gameState.isJumping = false;
                gameState.playerVy = 0;
            }
        }

        // Таймер неуязвимости
        if (gameState.isInvincible) {
            if (now - gameState.invincibleTimer > 2000) {
                gameState.isInvincible = false;
            }
        }
        
        CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);

        // 1. Проверка времени вопроса
        if (availableQuestions.length > 0 && now > gameState.questionTimer) {
            showQuestion();
            requestAnimationFrame(gameLoop); 
            return;
        }

        // 2. Спаун объектов 
        const obstacleChance = 0.005; 
        const starChance = 0.015;     

        if (Math.random() < (Math.random() < 0.4 ? starChance : obstacleChance)) { 
            const lane = Math.floor(Math.random() * 3);
            const lastObj = gameState.objects[gameState.objects.length - 1];
            
            if (!lastObj || (lastObj.z < 2200)) { 
                if (Math.random() < 0.7 && Math.random() < starChance / obstacleChance) { 
                     gameState.objects.push(new Star(3000, lane));
                } else { 
                     gameState.objects.push(new Obstacle(3000, lane));
                }
            }
        }
        
        // 3. Обновление и отрисовка
        const lerpSpeed = 0.25;
        currentLaneX += (targetLane - currentLaneX) * lerpSpeed;
        gameState.playerLane = Math.round(currentLaneX); 

        // Сортировка только игровых объектов
        gameState.objects.sort((a, b) => b.z - a.z);

        // Обновление, отрисовка и коллизии
        for (let i = gameState.objects.length - 1; i >= 0; i--) {
            let obj = gameState.objects[i];
            obj.update(dt);
            
            if (obj.active) obj.draw(); 
            
            // Коллизии
            if (obj.active && obj.z < 150 && obj.z > -50) {
                 if (Math.abs(obj.laneIndex - currentLaneX) < 0.5) {
                     if (obj.type === 'obstacle') {
                         if (gameState.playerY < 50) { 
                              handleCollision(obj);
                         }
                     } else if (obj.type === 'star') {
                         handleCollision(obj);
                     }
                 }
            }
            
            // Удаляем объекты, ушедшие за игрока
            if (obj.z < -200) {
                obj.active = false;
                gameState.objects.splice(i, 1);
            }
        }


        drawPlayer();
        requestAnimationFrame(gameLoop);
    }

    function handleCollision(obj) {
        if (obj.type === 'star') {
            obj.active = false; 
            gameState.score += 10; 
            updateUI();
            gameState.consecutiveHits = 0; // СБРОС: Сбор звезды сбрасывает счетчик ударов
        } 
        else if (obj.type === 'obstacle') {
            if (!gameState.isInvincible) {
                
                gameState.consecutiveHits++; // УВЕЛИЧЕНИЕ СЧЕТЧИКА
                
                if (gameState.consecutiveHits >= 3) {
                     // ТРИ УДАРА ПОДРЯД: ПОТЕРЯ ЖИЗНИ
                     takeDamage();
                     gameState.consecutiveHits = 0; // Сброс после потери жизни
                } else {
                    // Пока только неуязвимость, жизнь не теряем
                    // Включаем кратковременную неуязвимость, чтобы избежать нескольких ударов от одного и того же объекта
                    gameState.isInvincible = true;
                    gameState.invincibleTimer = Date.now();
                }
            }
        }
    }

    function drawPlayer() {
        // Эффект мигания при неуязвимости
        if (gameState.isInvincible && Math.floor(Date.now() / 100) % 2 === 0) return;

        const pScale = 1.0; 
        const pW = gameState.images.player.width * 0.25;
        const pH = gameState.images.player.height * 0.25;
        
        const playerZ = 50;
        const scale = perspective.fieldOfView / (perspective.fieldOfView + playerZ);
        const laneOffset = currentLaneX - 1; 
        let x = (CANVAS.width / 2) + (laneOffset * gameState.laneWidth * 4 * scale);
        
        let jumpY = gameState.playerY * scale; 
        let y = perspective.horizonY + (perspective.cameraHeight * scale) - pH + 10 - jumpY;

        CTX.drawImage(gameState.images.player, x - pW/2, y, pW, pH);
    }

</script>
